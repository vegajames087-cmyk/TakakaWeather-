name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: weather-rivers-debug-signing-v1
      - name: Create debug signing key if not cached
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate source, XML and dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/nz/co/takakaweather/MainActivity.java
          test -f app/src/main/java/nz/co/takakaweather/WeatherData.java
          test -f app/src/main/java/nz/co/takakaweather/RiverData.java
          test -f app/src/main/java/nz/co/takakaweather/RiverWidgetProvider.java
          test -f app/src/main/java/nz/co/takakaweather/RiverRefreshWorker.java
          test -f app/src/main/res/layout/widget_river.xml
          test -f app/src/main/res/xml/river_widget_info.xml
          test -f app/src/test/java/nz/co/takakaweather/RiverDataTest.java
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          for path in [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/layout/widget_river.xml",
              "app/src/main/res/xml/river_widget_info.xml",
              "app/src/main/res/values/strings.xml",
          ]:
              ET.parse(path)
          html = open("app/src/main/assets/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline JavaScript found"
          for feature in [
              "const API_BASE = window.location.protocol==='file:'?'https://takakaweather.vercel.app':'';",
              "fetch(API_BASE+'/api/dashboard?lat='",
              "fetch(API_BASE+'/api/tides?lat='",
              "tideReferenceAreas",
              "id=\"iconForecastPanel\"",
              "paintWeather('i',j.icon)",
              "ECMWF / OPEN-METEO",
          ]:
              assert feature in html, "Missing shipped feature: " + feature
          open("/tmp/weather-dashboard.js", "w", encoding="utf-8").write("\n".join(scripts))
          print("XML, native data bridge, all four official graph endpoints and dashboard script checks passed")
          PY
          node --check /tmp/weather-dashboard.js
      - name: Run river parser tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK package and embedded data features
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -q 'environmentalgraph/2/244/1/week'
          unzip -p "$APK" assets/index.html | grep -q 'environmentalgraph/2/243/1/week'
          # Reject APKs packaging an outdated dashboard rather than the checked-out source.
          unzip -p "$APK" assets/index.html | sha256sum | cut -d' ' -f1 > /tmp/apk-dashboard.sha256
          sha256sum app/src/main/assets/index.html | cut -d' ' -f1 > /tmp/source-dashboard.sha256
          diff -u /tmp/source-dashboard.sha256 /tmp/apk-dashboard.sha256
          echo "Verified packaged dashboard matches source at commit $GITHUB_SHA"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package: name='nz.co.takakaweather' versionCode='102' versionName='1.5'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-rivers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
