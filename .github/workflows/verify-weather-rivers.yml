name: Verify Weather & Rivers APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify dashboard JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          assert scripts, 'No dashboard JavaScript'
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts))
          assert 'id="iconEnabled"' in html
          assert 'temperatureUnit' not in html
          PY
          node --check /tmp/dashboard.js
      - name: Build debug APK
        run: |
          gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-rivers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
